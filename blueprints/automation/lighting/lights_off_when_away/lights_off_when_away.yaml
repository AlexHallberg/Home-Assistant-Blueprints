blueprint:
  name: Turn off lights when nobody is home
  description: >-
    Version v2026.10.0. See the
    [changelog](https://github.com/AlexHallberg/Home-Assistant-Blueprints/blob/main/blueprints/automation/lighting/lights_off_when_away/CHANGELOG.md).


    Once a day, at the time you choose, turns off every light in Home Assistant if nobody is home.


    "Nobody is home" means the home zone counts 0 people. A zone's state is the number of
    people in it. If the zone is `unknown` or `unavailable`, nothing is turned off, because it
    is not certain the house is empty.
  author: Alexander Hallberg (https://github.com/AlexHallberg)
  homeassistant:
    min_version: 2024.10.0
  domain: automation
  source_url: https://raw.githubusercontent.com/AlexHallberg/Home-Assistant-Blueprints/main/blueprints/automation/lighting/lights_off_when_away/lights_off_when_away.yaml

  input:
    home_zone:
      name: Home zone
      description: >-
        The zone whose person count decides whether anybody is home. Only people (`person`
        entities) are counted, not device trackers on their own.
      default: zone.home
      selector:
        entity:
          filter:
            - domain: zone

    check_time:
      name: Time
      description: When to check every day.
      default: "03:00:00"
      selector:
        time: {}

mode: single

triggers:
  - id: Daily check
    trigger: time
    at: !input check_time

variables:
  input_home_zone: !input home_zone
  people_home: "{{ states(input_home_zone) | int(-1) }}"

conditions:
  - alias: The home zone's person count is known
    condition: template
    value_template: "{{ people_home >= 0 }}"
  - alias: Nobody is home (0 people in the home zone)
    condition: template
    value_template: "{{ people_home == 0 }}"

actions:
  - alias: Turn off all lights
    action: light.turn_off
    target:
      entity_id: all
