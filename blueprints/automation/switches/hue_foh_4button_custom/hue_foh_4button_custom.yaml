blueprint:
  name: Hue, Friends Of Hue switch, 4 button, all functions
  description: >
    HA version 2023.08 or newer

    Works with all functions

    Correct the problem of "short release" triggered on the same time as "long release"

    If multiple switches need the same functionality, select multiple

  author: Alexander Hallberg (https://github.com/AlexHallberg)
  homeassistant:
    min_version: 2023.8.0
  domain: automation
  source_url: https://raw.githubusercontent.com/AlexHallberg/Home-Assistant-Blueprints/main/blueprints/automation/switches/hue_foh_4button_custom/hue_foh_4button_custom.yaml
  input:
    hue-switch-button1:
      name: "Hue Switch button 1"
      description: "Upper Left"
      selector:
        entity:
          device_class: button
          multiple: true
    hue-switch-button2:
      name: "Hue Switch button 2"
      description: "Lower Left"
      selector:
        entity:
          device_class: button
          multiple: true
    hue-switch-button3:
      name: "Hue Switch button 3"
      description: "Upper Right"
      selector:
        entity:
          device_class: button
          multiple: true
    hue-switch-button4:
      name: "Hue Switch button 4"
      description: "Lower Right"
      selector:
        entity:
          device_class: button
          multiple: true
    button_1_short_release:
      name: Short Release 1
      description: Action to run on button upper-left short release
      default: []
      selector:
        action: {}
    button_2_short_release:
      name: Short Release 2
      description: Action to run on button lower-left short release
      default: []
      selector:
        action: {}
    button_3_short_release:
      name: Short Release 3
      description: Action to run on button upper-right short release
      default: []
      selector:
        action: {}
    button_4_short_release:
      name: Short Release 4
      description: Action to run on button lower-right short release
      default: []
      selector:
        action: {}

    button_1_long_release:
      name: Long Release 1
      description: Action to run on button upper-left long release
      default: []
      selector:
        action: {}
    button_2_long_release:
      name: Long Release 2
      description: Action to run on button lower-left long release
      default: []
      selector:
        action: {}
    button_3_long_release:
      name: Long Release 3
      description: Action to run on button upper-right long release
      default: []
      selector:
        action: {}
    button_4_long_release:
      name: Long Release 4
      description: Action to run on button lower-right long release
      default: []
      selector:
        action: {}

    button_1_press:
      name: Press 1
      description: Action to run on button upper-left initial press
      default: []
      selector:
        action: {}
    button_2_press:
      name: Press 2
      description: Action to run on button lower-left initial press
      default: []
      selector:
        action: {}
    button_3_press:
      name: Press 3
      description: Action to run on button upper-right initial press
      default: []
      selector:
        action: {}
    button_4_press:
      name: Press 4
      description: Action to run on button lower-right initial press
      default: []
      selector:
        action: {}

    button_1_repeat:
      name: Repeat 1
      description: Action to run on button upper-left repeat
      default: []
      selector:
        action: {}
    button_2_repeat:
      name: Repeat 2
      description: Action to run on button lower-left repeat
      default: []
      selector:
        action: {}
    button_3_repeat:
      name: Repeat 3
      description: Action to run on button upper-right repeat
      default: []
      selector:
        action: {}
    button_4_repeat:
      name: Repeat 4
      description: Action to run on button lower-right repeat
      default: []
      selector:
        action: {}

mode: queued
max: 10

# not_from / not_to: when the Hue bridge reconnects, each button entity goes from
# "unavailable" back to its last event, which would otherwise replay that event's action.
trigger:
  - id: B1
    platform: state
    entity_id: !input "hue-switch-button1"
    not_from: &not_unavailable
      - unavailable
      - unknown
    not_to: *not_unavailable
  - id: B2
    platform: state
    entity_id: !input "hue-switch-button2"
    not_from: *not_unavailable
    not_to: *not_unavailable
  - id: B3
    platform: state
    entity_id: !input "hue-switch-button3"
    not_from: *not_unavailable
    not_to: *not_unavailable
  - id: B4
    platform: state
    entity_id: !input "hue-switch-button4"
    not_from: *not_unavailable
    not_to: *not_unavailable

action:
  - alias: Read the button event
    variables:
      switch_to_state: "{{ trigger.to_state.attributes.event_type }}"
      switch_from_state: "{{ trigger.from_state.attributes.event_type }}"
      switch_id: "{{ trigger.id }}"
      #    switch_from_ID: '{{ trigger.entity_id }}'
  - alias: Run the action for this button and event
    choose:
      - alias: Initial press
        conditions:
          - alias: Event is an initial press
            condition: template
            value_template: "{{ switch_to_state == 'initial_press' }}"
        sequence:
          - alias: Run the press action for this button
            choose:
              - alias: Button 1 (upper left)
                conditions:
                  - &cond_b1
                    alias: Button 1 (upper left)
                    condition: template
                    value_template: "{{ switch_id == 'B1' }}"
                sequence: !input "button_1_press"
              - alias: Button 2 (lower left)
                conditions:
                  - &cond_b2
                    alias: Button 2 (lower left)
                    condition: template
                    value_template: "{{ switch_id == 'B2' }}"
                sequence: !input "button_2_press"
              - alias: Button 3 (upper right)
                conditions:
                  - &cond_b3
                    alias: Button 3 (upper right)
                    condition: template
                    value_template: "{{ switch_id == 'B3' }}"
                sequence: !input "button_3_press"
              - alias: Button 4 (lower right)
                conditions:
                  - &cond_b4
                    alias: Button 4 (lower right)
                    condition: template
                    value_template: "{{ switch_id == 'B4' }}"
                sequence: !input "button_4_press"

      - alias: Button held (repeat)
        conditions:
          - alias: Event is a repeat
            condition: template
            value_template: "{{ switch_to_state == 'repeat' }}"
        sequence:
          - alias: Run the repeat action for this button
            choose:
              - alias: Button 1 (upper left)
                conditions:
                  - *cond_b1
                sequence: !input "button_1_repeat"
              - alias: Button 2 (lower left)
                conditions:
                  - *cond_b2
                sequence: !input "button_2_repeat"
              - alias: Button 3 (upper right)
                conditions:
                  - *cond_b3
                sequence: !input "button_3_repeat"
              - alias: Button 4 (lower right)
                conditions:
                  - *cond_b4
                sequence: !input "button_4_repeat"

      - alias: Hold released
        conditions:
          - alias: Event is a long release
            condition: template
            value_template: "{{ switch_to_state == 'long_release' }}"
        sequence:
          - alias: Run the long release action for this button
            choose:
              - alias: Button 1 (upper left)
                conditions:
                  - *cond_b1
                sequence: !input "button_1_long_release"
              - alias: Button 2 (lower left)
                conditions:
                  - *cond_b2
                sequence: !input "button_2_long_release"
              - alias: Button 3 (upper right)
                conditions:
                  - *cond_b3
                sequence: !input "button_3_long_release"
              - alias: Button 4 (lower right)
                conditions:
                  - *cond_b4
                sequence: !input "button_4_long_release"

      - alias: Short press released
        conditions:
          - alias: Event is a short release
            condition: template
            value_template: "{{ switch_to_state == 'short_release' }}"
        sequence:
          - alias: Ignore a short release that follows a hold
            choose:
              - alias: Previous event was the initial press (a real short press)
                conditions:
                  - alias: Previous event from this button was an initial press
                    condition: template
                    value_template: "{{ switch_from_state == 'initial_press' }}"
                sequence:
                  - alias: Run the short release action for this button
                    choose:
                      - alias: Button 1 (upper left)
                        conditions:
                          - *cond_b1
                        sequence: !input "button_1_short_release"
                      - alias: Button 2 (lower left)
                        conditions:
                          - *cond_b2
                        sequence: !input "button_2_short_release"
                      - alias: Button 3 (upper right)
                        conditions:
                          - *cond_b3
                        sequence: !input "button_3_short_release"
                      - alias: Button 4 (lower right)
                        conditions:
                          - *cond_b4
                        sequence: !input "button_4_short_release"
