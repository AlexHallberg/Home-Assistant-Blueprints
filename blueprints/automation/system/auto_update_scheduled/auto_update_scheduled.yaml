####################################################################################################
#####                        Home Assistant Auto-update on Schedule                            #####
#####             Repository: https://github.com/edwardtfn/ha_auto_update_scheduled            #####
#####             Fork: https://github.com/AlexHallberg/Home-Assistant-Blueprints              #####
####################################################################################################
##### Purpose: YAML blueprint to automatically update Home Assistant and its components when   #####
#####          updates are available, following a schedule and with configurable options.      #####
####################################################################################################
##### Author: edwardtfn - https://github.com/edwardtfn - https://buymeacoffee.com/edwardfirmo  #####
####################################################################################################
##### NOTE:                                                                                    #####
##### - Home Assistant may restart automatically as part of the update process.                #####
##### - Use under your own risk! Please review Home Assistant community discussions about      #####
#####   the risks involved in auto-updating the system.                                        #####
##### - SECURITY WARNING:                                                                      #####
#####   - Ensure you have reliable backups before enabling automatic updates                   #####
#####   - Auto-updates in production environments may lead to system instability               #####
#####   - Updates may affect connected devices and integrations                                #####
##### - For discussions:                                                                       #####
#####     https://community.home-assistant.io/t/459281                                         #####
##### - For support, bug reports and new ideas:                                                #####
#####     https://github.com/edwardtfn/ha_auto_update_scheduled/issues                         #####
####################################################################################################
---
blueprint:
  name: Home Assistant Auto-update
  author: Edward Firmo (https://github.com/edwardtfn)
  homeassistant:
    min_version: 2025.8.0
  description: >
    # Home Assistant Auto-update

    Update Home Assistant automatically when a new update is available.

    Fork of [edwardtfn/ha_auto_update_scheduled](https://github.com/edwardtfn/ha_auto_update_scheduled)
    by [Edward Firmo](https://github.com/edwardtfn).

    Version v2026.10.2, based on upstream v2026.6.0. See the
    [changelog](https://github.com/AlexHallberg/Home-Assistant-Blueprints/blob/main/blueprints/automation/system/auto_update_scheduled/CHANGELOG.md).

    ## Attention:

    - Home Assistant may restart automatically as part of the update process.

    - **Use under your own risk!** Please see the discussions on Home Assistant community around the risks involved on auto-updating the system.

    - Ensure you have reliable backups before enabling automatic updates.

    - Auto-updates in production environments may lead to system instability.

    - Updates may affect connected devices and integrations.

    ## For discussions:
      - [Home Assistant Community portal](https://community.home-assistant.io/t/459281)

    ## For support, bug reports and new ideas:
      - [GitHub Issues](https://github.com/edwardtfn/ha_auto_update_scheduled/issues)
  domain: automation
  source_url: https://raw.githubusercontent.com/AlexHallberg/Home-Assistant-Blueprints/main/blueprints/automation/system/auto_update_scheduled/auto_update_scheduled.yaml
  input:
    when_section:
      name: When (Schedule, etc.)
      icon: mdi:calendar
      description: Select when the updates should happen and when it should be skipped.
      collapsed: false
      input:
        schedule_entity:
          name: Schedule entity
          description: >
            You can create a [Schedule](https://www.home-assistant.io/integrations/schedule) under
            [Settings > Devices & Services > Helpers](https://my.home-assistant.io/redirect/config_flow_start/?domain=schedule).

            Note => The schedule windows will define when an update will start.
            It is possible that a backup, an update or a restart process finishes after the schedule window,
            but new updates won't start outside the schedule windows.

            Leave empty to install updates whenever they are found, with no schedule.
          default: []
          selector:
            entity:
              multiple: false
              domain: schedule

        schedule_monthday_earliest:
          name: Earliest day in the month to run the update process
          description: >
            Usually a new major version of Home Assistant is available on the begining of every month.
            Some people consider those releases as not stable enough and prefer to avoid those versions,
            not updating the system until the mid of the month (day 15).

            Notes:
              - If you select a day higher than 28 the updates won't run every month.
              - Selecting `0` will disable the check.
          default: 0
          selector:
            number:
              min: 1
              max: 31
              step: 1
              mode: slider

        schedule_monthday_last:
          name: Latest day in the month to run the update process
          description: >
            Specify the latest day in month, on which this update can run.

            Note:
              - Selecting `0` or a date lower than the "Earliest Day" will disable the check.
          default: 0
          selector:
            number:
              min: 0
              max: 31
              step: 1
              mode: slider

        update_out_of_schedule:
          name: Out of schedule entities
          description: |
            `Optional`

            You can select update entities which will be updated as soon an update is detected,
            even if outside the schedule windows.

            Notes:
              - Pause entities will be respected and prevent the update of the out of schedule entities.
              - The out of schedule update can trigger a restart at an unexpected time outside the normal schedule.
                Please use it with caution.
          default: []
          selector:
            entity:
              multiple: true
              domain:
                - update

        pause_entities:
          name: Pause update entities
          description: |
            `Optional`

            You can select one or more entities to pause the updates.
            If any of the selected entities is "On" or "True" the system won't be updated on the schedule time.

            You can use this to hold your updates when you have a party at home,
            or when you are on vacations and don't want to be concerned about updates on Home Assistant.
          default: []
          selector:
            entity:
              multiple: true
              domain:
                - input_boolean
                - binary_sensor
                - switch

    what_section:
      name: What (optional)
      icon: mdi:update
      description: Select what should be updated and what shouldn't be updated.
      collapsed: true
      input:
        core_os_update_mode:
          name: Update mode for Home Assistant core and OS updates
          description: >
            Please select the update mode for Home Assistant core and Home Assistan OS updates.

            * All: All updates will be installed.

            * Patches only:
              ✅ From 2022.11.0 to 2022.11.3 will be updated (patches).
              ❌ From 2022.11.x to 2022.12.x will be ignored (minor update).
              ❌ From 2022.12.x to 2023.1.x will be ignored (major update).
            * Don't update: Ignore any update.

          default: "all"
          selector: &update_mode-selector
            select:
              multiple: false
              options:
                - label: All
                  value: "all"
                - label: Patches only
                  value: "patches"
                - label: Don't update
                  value: "ignore"

        core_os_minimum_patch_version:
          name: Minimum patch version for core and OS updates
          description: >
            Skip core and OS updates until the new version's patch number reaches this value.
            `0` (default) turns the filter off.

            Examples: `1` skips `x.y.0` and allows `x.y.1` and above;
            `2` skips `x.y.0` and `x.y.1` and allows `x.y.2` and above.

            Versions that are not dotted numbers are not filtered.
          default: 0
          selector: &minimum_patch_version-selector
            number:
              min: 0
              max: 9
              step: 1
              mode: slider

        firmware_update_mode:
          name: Update mode for device's firmware
          description: >
            Please select the update mode for firmware in the devices connected to Home Assistant (when supported as an HA update).

            * All: All updates will be installed.

            * Patches only:
              ✅ From 2022.11.0 to 2022.11.3 will be updated (patches).
              ❌ From 2022.11.x to 2022.12.x will be ignored (minor update).
              ❌ From 2022.12.x to 2023.1.x will be ignored (major update).
            * Don't update: Ignore any update.

          default: "all"
          selector: *update_mode-selector

        firmware_minimum_patch_version:
          name: Minimum patch version for device firmware
          description: >
            Skip device firmware until the new version's patch number reaches this value.
            `0` (default) turns the filter off.

            Examples: `1` skips `x.y.0` and allows `x.y.1` and above;
            `2` skips `x.y.0` and `x.y.1` and allows `x.y.2` and above.

            Versions that are not dotted numbers are not filtered.
          default: 0
          selector: *minimum_patch_version-selector

        general_update_mode:
          name: Update mode for general updates
          description: >
            Please select the update mode for everything that is not a device's firmware or a core component of Home Assistant.

            This includes add-ons, HACS componentes, custom cards, etc.

            * All: All updates will be installed.

            * Patches only:
              ✅ From 2022.11.0 to 2022.11.3 will be updated (patches).
              ❌ From 2022.11.x to 2022.12.x will be ignored (minor update).
              ❌ From 2022.12.x to 2023.1.x will be ignored (major update).
            * Don't update: Ignore any update.

          default: "all"
          selector: *update_mode-selector

        general_minimum_patch_version:
          name: Minimum patch version for general updates
          description: >
            Skip general updates until the new version's patch number reaches this value.
            `0` (default) turns the filter off.

            Examples: `1` skips `x.y.0` and allows `x.y.1` and above;
            `2` skips `x.y.0` and `x.y.1` and allows `x.y.2` and above.

            Versions that are not dotted numbers are not filtered.
          default: 0
          selector: *minimum_patch_version-selector

        update_inclusion_mode:
          name: Entity Inclusion Mode
          description: >-
            Please select the entity inclusion mode.
            * All:
              Just build the update entity list from all available update.* entities, which are in state 'on'.
            * Specified/Specified-Single:
              Build the update entity list from the specified entity list, filtering for entities in 'on' state.
              - Specified: Updates all matching entities
              - Specified-Single: Updates only the first matching entity
            * Searchfilter:
              This works as a wildcard filter.
              Examples:
                'update.zigbee2mqtt_'   => all update entities from zigbee2mqtt addon
                'update.esphome_'       => all update entities from esphome devices if their names start with 'esphome_'
            * Searchfilter-Single:
              Just like the searchfilter, but only the first entity. (Sorted alphabetically)
          default: "all"
          selector:
            select:
              multiple: false
              options:
                - label: All
                  value: "all"
                - label: Specified
                  value: "specified"
                - label: Specified-Single
                  value: "specified-single"
                - label: Searchfilter
                  value: "searchfilter"
                - label: Searchfilter-Single
                  value: "searchfilter-single"

        update_inclusion_entity_list:
          name: Entity Inclusion List
          description: >-
            => Important: This entity list will only be used when the Update Inclusion mode is set to "Specified" or "Specified-Single".
            Select the items which should be updated.
          default: []
          selector:
            entity:
              multiple: true
              domain: update

        update_inclusion_entity_searchfilter:
          name: Entity Inclusion Searchfilter
          description: >-
            => Important: This searchfilter will only be used when the Update Inclusion mode is set to "Searchfilter" or "Searchfilter-Single".
            This defines the Searchfilter for finding the right update entities.
            This enables wildcard-like searching for a group of entities, aka "all zigbee entities" or "everything from Sonoff" etc.
          default: ""
          selector:
            text:
              multiline: false

        update_exclusions:
          name: Exclusions
          description: |
            `Optional`

            Select the items that should NOT be included on the automated updates.

            => Use this if you want to keep some add-on on an specific version and avoid auto-updates to it.
          default: []
          selector:
            entity:
              multiple: true
              domain: update

    backup_section:
      name: Backup (optional)
      icon: mdi:backup-restore
      description: Select the back-up options
      collapsed: true
      input:
        backup_mode:
          name: Create a backup before starting the updates?
          description: >
            Select when to create a backup before updates are installed.

            Backups are created using the
            [backup.create_automatic](https://www.home-assistant.io/integrations/backup/#action-backupcreate_automatic)
            action, which uses the backup settings you have configured under
            [Settings > System > Backups](https://my.home-assistant.io/redirect/backup/).

            * **Never**: No backup will be created by this automation.

            * **When no recent backup is detected**: A backup will only be created if the last successful
              backup is older than the "Maximum backup age" threshold.
              This requires the "Backup state sensor", "Last successful automatic backup sensor"
              and "Maximum backup age" settings below to be configured.

            * **Always**: A backup will always be created before updates are installed.
          default: "never"
          selector:
            select:
              multiple: false
              options:
                - label: Never
                  value: "never"
                - label: When no recent backup is detected
                  value: "auto"
                - label: Always
                  value: "always"

        backup_timeout:
          name: Backup timeout
          description: >
            Maximum time to wait for the backup process to complete.

            This is only used when "Create a backup before starting the updates" is set to
            "When no recent backup is detected" or "Always".

            If a Backup state sensor is configured below, the automation will actively monitor the
            backup status and continue as soon as it completes.
            Otherwise, it will wait for the full duration before proceeding.
          default: 60
          selector:
            number:
              mode: box
              min: 1
              max: 180
              unit_of_measurement: minutes

        run_during_backup:
          name: Backup state sensor
          description: |
            `Optional`

            Select the Backup Manager State sensor from the native Home Assistant Backup integration.
            When selected, this automation will wait for the backup system to be `idle` before starting updates.
            No update will be executed while the backup system is in any other state
            (`create_backup`, `receive_backup`, `restore_backup`, `blocked`) or "unavailable".

            This sensor is also used to detect when the backup created by this automation has completed,
            instead of relying on a fixed timeout.

            **Required** when backup mode is set to "When no recent backup is detected".

            **Strongly recommended** together with the "Last successful automatic backup sensor" below:
            that sensor is what allows the automation to confirm that a new backup was really created.
            Without it, a backup that finishes while the backup action is still running cannot be
            confirmed, and the automation continues with the updates after logging a warning.

            This sensor is provided by the [Backup integration](https://www.home-assistant.io/integrations/backup/)
            and is typically named `sensor.backup_backup_manager_state`.

            If no sensor is selected, this automation won't pause due to a backup in progress.
          default: []
          selector:
            entity:
              multiple: false
              filter:
                domain: sensor
                device_class: enum
                integration: backup

        last_backup_timestamp_entity:
          name: Last successful automatic backup sensor
          description: |
            `Optional`

            Select the "Last successful automatic backup" timestamp sensor from the native
            Home Assistant Backup integration.

            **Required** when backup mode is set to "When no recent backup is detected".

            This sensor is also how the automation confirms that a new backup was created:
            its value is read before and after the backup action, and a newer timestamp
            confirms the backup, no matter how long the backup took.

            If this sensor is not selected, the backup cannot be confirmed. In that case the
            automation logs a warning and continues with the updates, so the updates may run
            without a verified backup.

            This sensor is provided by the [Backup integration](https://www.home-assistant.io/integrations/backup/)
            and is typically named `sensor.backup_last_successful_automatic_backup`.
          default: []
          selector:
            entity:
              multiple: false
              filter:
                domain: sensor
                device_class: timestamp
                integration: backup

        max_backup_age:
          name: Maximum backup age
          description: |
            `Optional`

            The maximum acceptable age of the last successful automatic backup.

            **Required** when backup mode is set to "When no recent backup is detected".
            In that mode, a new backup will be created only if the last successful backup
            is older than this threshold.

            When backup mode is "Always" or "Never", this setting is ignored.
          default:
            days: 1
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: true

    actions_section:
      name: Actions (optional)
      icon: mdi:shoe-print
      description: >
        Select actions to run at different moments during the update process.

        The "Pre-update", "Pre-restart" and "Post-update" actions run once at their respective stages.

        The step-specific actions (Starting, Backup, Update progress, Errors, Restart, Done)
        run at each occurrence of that step and have access to useful variables like the list of
        pending updates, the current entity being updated, and a log message describing the current step.
        These are independent of the built-in notification system.
      collapsed: true
      input:
        actions_pre_update:
          name: Pre-update actions
          description: |
            `Optional`

            Actions to execute before the backup or any update starts.

            You can use this to send notifications, turn on/off devices or activate scenes before starting the updates.


            Note => Please be aware that all actions will run right before the update process,
            which can happens over-night. Take this in account when selecting your actions.

            Note => Some usefull variables available for your actions:
              - `{{ updates_list }}` - contains the list of updates when the automation started.
              - `{{ updates_pending }}` - contains the list of updates remaining to be updated.
          default: []
          selector:
            action: {}

        actions_pre_restart:
          name: Pre-restart actions
          description: |
            `Optional`

            Actions to execute before the automation requests a restart.

            You can use this to send notifications,
            turn on/off devices or stopping automations before restarting Home Assistant.


            Note => Please be aware that all actions will run right before the restart process,
            which can happens over-night. Take this in account when selecting your actions.

            Note => Note all the restarts will be controlled by this automation,
            like when a Core update is installed. These actions might not be executed in those cases.

            Note => Some usefull variables available for your actions:
              - `{{ updates_list }}` - contains the list of updates when the automation started.
              - `{{ updates_pending }}` - contains the list of updates remaining to be updated.
          default: []
          selector:
            action: {}

        actions_pos_update:
          name: Post-update actions
          description: |
            `Optional`

            Actions to execute AFTER the update process finishes.

            You can use this to send notifications, turn on/off devices or activate scenes after applying  the updates.


            Note => Please be aware that all actions will run right after the update process,
            which can happens over-night.
            Take this in account when selecting your actions.

            Note => Some usefull variables available for your actions:
              - `{{ updates_list }}` - contains the list of updates when the automation started.
              - `{{ updates_pending }}` - contains the list of updates remaining to be updated.

            **IMPORTANT** => Some updates will automatically restart Home Assistant,
            causing the automation to interrupt before finishing, preventing the pos-updates actions to be executed.
            If you have critical actions to run after an update,
            consider including also in another automation based on Home Assistant start.
          default: []
          selector:
            action: {}

        notification_action_starting:
          name: Step action - Starting
          description: |
            `Optional`

            Actions to run when the update process starts.

            Useful variables available:
              - `{{ updates_list }}` - List of all update entity ids detected when the automation started.
              - `{{ updates_pending }}` - List of update entity ids remaining to be processed.
              - `{{ updates_pending_count }}` - Number of pending updates.
              - `{{ log_message }}` - A plain text message describing the current step.
          default: []
          selector:
            action: {}

        notification_action_backup:
          name: Step action - Backup
          description: |
            `Optional`

            Actions to run at each backup-related step (starting, completed, or fallback wait finished).

            Useful variables available:
              - `{{ log_message }}` - A plain text message describing what happened.
              - `{{ updates_list }}` - List of all update entity ids detected when the automation started.
              - `{{ updates_pending }}` - List of update entity ids remaining to be processed.
          default: []
          selector:
            action: {}

        notification_action_update_progress:
          name: Step action - Update progress
          description: |
            `Optional`

            Actions to run for each individual update (when it starts and when it completes or times out).

            Useful variables available:
              - `{{ current_update_entity }}` - The entity id of the update being processed (e.g. `update.home_assistant_core_update`).
              - `{{ current_update_entity_friendly_name }}` - The friendly name of the update being processed.
              - `{{ log_message }}` - A plain text message describing the current step.
              - `{{ updates_list }}` - List of all update entity ids detected when the automation started.
              - `{{ updates_pending }}` - List of update entity ids remaining to be processed.
          default: []
          selector:
            action: {}

        notification_action_errors:
          name: Step action - Errors and warnings
          description: |
            `Optional`

            Actions to run when an error or warning occurs (update timeouts, backup failures,
            remaining incomplete updates, or backup misconfiguration).

            Useful variables available:
              - `{{ log_message }}` - A plain text message describing the error.
              - `{{ current_update_entity }}` - The entity id of the update being processed (when applicable).
              - `{{ current_update_entity_friendly_name }}` - The friendly name of the update (when applicable).
              - `{{ updates_list }}` - List of all update entity ids detected when the automation started.
              - `{{ updates_pending }}` - List of update entity ids remaining to be processed.
          default: []
          selector:
            action: {}

        notification_action_restart:
          name: Step action - Restart
          description: |
            `Optional`

            Actions to run when a restart is pending.
            These run before the actual restart, giving time for the actions to complete.

            Useful variables available:
              - `{{ pending_restart_items }}` - List of names of items requiring a restart.
              - `{{ pending_restart_items_count }}` - Number of items requiring a restart.
              - `{{ log_message }}` - A plain text message describing the current step.
              - `{{ updates_list }}` - List of all update entity ids detected when the automation started.
          default: []
          selector:
            action: {}

        notification_action_done:
          name: Step action - Done
          description: |
            `Optional`

            Actions to run when the update process is complete.

            Useful variables available:
              - `{{ remaining_updates }}` - List of names of updates that were not completed (if any).
              - `{{ remaining_updates_count }}` - Number of remaining updates.
              - `{{ updates_list }}` - List of all update entity ids detected when the automation started.
              - `{{ updates_pending }}` - List of update entity ids remaining (should match remaining_updates).
              - `{{ log_message }}` - A plain text message describing the current step.
          default: []
          selector:
            action: {}

    notification_section:
      name: Notifications (optional)
      icon: mdi:bell
      description: Here you can setup optional notifications. Select a notify entity to enable notifications.
      collapsed: true
      input:
        notification_entity:
          name: Notify entity
          description: >
            Select a notify entity to send messages to.

            Notify entities are provided by notification integrations (e.g. Telegram, email, etc.)
            and are listed under the `notify` domain.

            If your notification target is not listed, you can create a
            [Notification Group](https://www.home-assistant.io/integrations/group/#notify-groups)
            (even with a single device) to make it available as a selectable entity.

            Note: Notifications are sent in plain text.
            If your notification service supports rich formatting (e.g. Telegram MarkdownV2),
            you can use the step actions to send custom formatted notifications instead.

            Leave empty to disable notifications.
          default: []
          selector:
            entity:
              multiple: false
              domain: notify

        notification_message_title:
          name: Notification title
          description: |
            `Optional`

            Select a title to be used on each notification message.

            You can type a custom text or select one of the predefined options.

            The default option "Automation's friendly name" uses the name you gave to this automation
            when you created it (e.g. "Nightly Auto-update"). If the automation has no friendly name,
            it falls back to "Home Assistant Auto-update".
          default: friendly_name
          selector:
            select:
              custom_value: true
              multiple: false
              options:
                - label: Automation's friendly name
                  value: friendly_name
                - label: Automation's entity Id
                  value: entity_id
                - label: Blank (no title)
                  value: blank

        notification_select_notifications:
          name: Select what to notify
          description: |
            Select which steps should trigger notifications.

            Note => The "Starting" notification includes the list of pending updates.
            The "Done" notification includes any remaining updates that were not completed.
          default:
            - starting
            - errors
            - done
          selector:
            select:
              multiple: true
              options:
                - label: Starting (includes list of updates)
                  value: starting
                - label: Backup progress
                  value: backup
                - label: Update progress (per entity)
                  value: update_progress
                - label: Errors and warnings only
                  value: errors
                - label: Restart
                  value: restart
                - label: Done (includes remaining updates)
                  value: done

    install_log_section:
      name: Install log (optional)
      icon: mdi:file-document-outline
      description: >
        Write a plain-text log of what was found, what was installed, and any errors to a file.
        Nothing is written on runs where there is nothing to update.
      collapsed: true
      input:
        install_log_entity:
          name: Install log file
          description: |
            `Optional`

            Select a notify entity from the [File](https://www.home-assistant.io/integrations/file/) integration.
            Each run appends the updates it found, each install with its versions, any errors,
            restarts, and a summary line.

            To create one, add the File integration under
            [Settings > Devices & Services](https://my.home-assistant.io/redirect/config_flow_start/?domain=file),
            choose "Set up a notification service", enter a path such as `/config/auto_update.log`,
            and leave "Timestamp" off (this blueprint writes its own timestamps).

            The file's folder must be listed under `allowlist_external_dirs` in `configuration.yaml`.

            Leave empty to disable the install log.
          default: []
          selector:
            entity:
              multiple: false
              domain: notify
              integration: file

        error_log_entity:
          name: Error log file
          description: |
            `Optional`

            Select a second File notify entity to receive a copy of every error and warning,
            for example `/config/auto_update_errors.log`.

            Errors are always written to the install log as well.

            Leave empty to keep errors in the install log only.
          default: []
          selector:
            entity:
              multiple: false
              domain: notify
              integration: file

    general_settings:
      name: General settings (optional)
      icon: mdi:cog
      description: Select additional settings to the update process
      collapsed: true
      input:
        restart_type:
          name: Force Home Assistant to restart if required by any update?
          description: >
            This won't affect updates where a restart is automatic,
            but for updates requiring a manual restart (quite common on HACS)
            this blueprint can automatically force a restart by the end of the updates.
          default: "no-restart"
          selector:
            select:
              multiple: false
              options:
                - label: "Don't force a restart"
                  value: "no-restart"
                - label: "Restart Home Assistant core"
                  value: "core"
                - label: "Restart Home Assistant host"
                  value: "host"

        verbose_logging_bool:
          name: Log addon progress with verbosity to the logbook?
          description: |
            `Optional`

            When enabled, this automation will register each step on the logbook.

            This can be usefull for troubleshooting, but at normal conditions, it won't add much value.
          default: false
          selector:
            boolean: {}

        update_process_started_entity:
          name: '"Update Process Started" Toggle Entity'
          description: |
            `Optional`

            You can create a [Toggle Helper](https://www.home-assistant.io/integrations/input_boolean) under
            [Settings > Devices & Services > Helpers](https://my.home-assistant.io/redirect/config_flow_start/?domain=input_boolean).

            This entity will be used to determine if we still have to do a backup
            on automation start - so it is for inner workings of this automation.

            This saves you from getting multiple backups in the same update window.
          default: []
          selector:
            entity:
              multiple: false
              domain: input_boolean

        update_timeout:
          name: Update Timeout
          description: |
            Maximum time to wait for each update to complete.

            This protects the automation of waiting forever for an update that fails.

            Usually updates don't take that very long,
            so feel free to ajust this time to something that fits better your environment.

            The default is 1200 seconds (20 minutes).
            You can select any value between 10 seconds and 7200 seconds (2 hours).

            If an update times out:
            - The automation will log an error message
            - The automation will continue with the next update
            - The timed-out update may still complete in the background
          default: 1200
          selector:
            number:
              min: 10
              max: 7200
              step: 10
              unit_of_measurement: seconds
              mode: box

mode: single
max_exceeded: warning

trigger_variables:
  input_pause_entities: !input pause_entities
  input_update_exclusions: !input update_exclusions
  schedule_monthday_earliest: !input schedule_monthday_earliest
  schedule_monthday_last: !input schedule_monthday_last
  input_schedule_monthday_earliest: '{{ schedule_monthday_earliest | int(0) }}'
  input_schedule_monthday_last: '{{ schedule_monthday_last | int(0) }}'
  input_update_inclusion_entity_list: !input update_inclusion_entity_list
  input_update_inclusion_entity_searchfilter: !input update_inclusion_entity_searchfilter
  input_update_process_started_entity: !input update_process_started_entity
  update_out_of_schedule: !input update_out_of_schedule

trigger:
  - id: HA Schedule based
    platform: state
    entity_id: !input schedule_entity
  - id: HA Start
    platform: homeassistant
    event: start
  - id: New update
    platform: template
    value_template: >-
      {% set ns = namespace(found=false) %}
      {% for e in states.update | default([])
           | selectattr("state", "eq", "on")
           | rejectattr("entity_id", "in", input_update_exclusions)
           | rejectattr("entity_id", "in", update_out_of_schedule) %}
        {% if (e.attributes.supported_features | int(0)) | bitwise_and(1) %}
          {% set ns.found = true %}
        {% endif %}
      {% endfor %}
      {{ ns.found }}
  - id: New day
    platform: template
    value_template: >
      {{
        (now().day >= input_schedule_monthday_earliest or input_schedule_monthday_earliest == 0) and
        (
          now().day <= input_schedule_monthday_last or
          input_schedule_monthday_last == 0 or
          input_schedule_monthday_last < input_schedule_monthday_earliest
        )
      }}
  - id: Automations reloaded
    platform: event
    event_type: automation_reloaded
  - id: Pause entities changed
    platform: state
    entity_id: !input pause_entities
  - id: Out of schedule
    platform: state
    entity_id: !input update_out_of_schedule
    from: "off"
    to: "on"
  - id: Backup sensor recovered
    platform: state
    entity_id: !input run_during_backup
    to: "idle"

condition:
  - alias: There is a reason to run
    condition: or
    conditions:
      - alias: Backup sensor has recovered
        condition: trigger
        id: "Backup sensor recovered"
      - alias: An out-of-schedule entity has an update
        condition: trigger
        id: "Out of schedule"
      - alias: Restarted or reloaded with out-of-schedule updates pending
        condition: and
        conditions:
          - alias: Triggered by Home Assistant start or automation reload
            condition: or
            conditions:
              - alias: Home Assistant started
                condition: trigger
                id: "HA Start"
              - alias: Automations were reloaded
                condition: trigger
                id: "Automations reloaded"
          - alias: Out-of-schedule entities have pending updates
            condition: template
            value_template: >-
              {{
                states.update
                | default([])
                | selectattr("state", "eq", "on")
                | selectattr("entity_id", "in", installable_entities)
                | selectattr("entity_id", "in", update_out_of_schedule)
                | rejectattr("entity_id", "in", input_update_exclusions)
                | list | count | int(0) > 0
              }}
      - alias: Inside the schedule with pending updates
        condition: and
        conditions:
          - alias: Schedule is on (or no schedule is set)
            condition: state
            entity_id: !input schedule_entity
            state: 'on'
          - alias: There are installable updates
            condition: template
            value_template: >-
              {{
                states.update
                | default([])
                | selectattr("state", "eq", "on")
                | selectattr("entity_id", "in", installable_entities)
                | rejectattr("entity_id", "in", input_update_exclusions)
                | list | count | int(0) > 0
              }}
      - alias: Resuming an update run after a restart
        condition: and
        conditions:
          - alias: Home Assistant started
            condition: trigger
            id: "HA Start"
          - alias: Update process toggle is configured
            condition: template
            value_template: '{{ update_process_toggle != "" }}'
          - alias: Update process toggle is on (a run was in progress)
            condition: state
            entity_id: !input update_process_started_entity
            state: "on"

  - alias: Today is an allowed day of the month
    condition: or
    conditions:
      - alias: Out-of-schedule updates ignore the day of month
        condition: trigger
        id: "Out of schedule"
      - alias: Today is within the earliest and last day of the month
        condition: template
        value_template: >
          {{
            (now().day >= input_schedule_monthday_earliest or input_schedule_monthday_earliest == 0) and
            (now().day <= input_schedule_monthday_last or input_schedule_monthday_last == 0)
          }}

  - alias: Updates are not paused
    condition: or
    conditions:
      - alias: No pause entities are configured
        condition: template
        value_template: "{{ input_pause_entities | default([]) | list | count | int(0) < 1 }}"
      - alias: Pause entities are off
        condition: state
        entity_id: !input pause_entities
        state: 'off'

variables:
  installable_entities: >
    {% set ns = namespace(list=[]) %}
    {% for e in states.update | default([]) %}
      {% if (e.attributes.supported_features | int(0)) | bitwise_and(1) %}
        {% set ns.list = ns.list + [e.entity_id] %}
      {% endif %}
    {% endfor %}
    {{ ns.list }}
  temp_input_update_exclusions: !input update_exclusions
  input_verbose_logging_bool: !input verbose_logging_bool
  input_core_os_update_mode: !input core_os_update_mode
  input_firmware_update_mode: !input firmware_update_mode
  input_general_update_mode: !input general_update_mode
  input_update_inclusion_mode: !input update_inclusion_mode
  input_core_os_minimum_patch_version: !input core_os_minimum_patch_version
  input_firmware_minimum_patch_version: !input firmware_minimum_patch_version
  input_general_minimum_patch_version: !input general_minimum_patch_version
  input_update_timeout: !input update_timeout
  input_schedule_entity: !input schedule_entity
  input_notification_entity: !input notification_entity
  input_notification_select_notifications: !input notification_select_notifications
  input_notification_message_title: !input notification_message_title
  input_install_log_entity: !input install_log_entity
  input_error_log_entity: !input error_log_entity
  core_update_entity: >
    {% for u in integration_entities('hassio') | select('search', '^update[.]')
      if (device_attr(u, 'identifiers') | first | default(""))[1] == 'core' %}
        {{ u }}
    {% endfor %}
  os_update_entity: >
    {% for u in integration_entities('hassio') | select('search', '^update[.]')
      if (device_attr(u, 'identifiers') | first | default(""))[1] == 'OS' %}
        {{ u }}
    {% endfor %}
  supervisor_update_entity: >
    {% for u in integration_entities('hassio') | select('search', '^update[.]')
      if (device_attr(u, 'identifiers') | first | default(""))[1] == 'supervisor' %}
        {{ u }}
    {% endfor %}
  # The entity selector (multiple: false) gives a plain string once set and the
  # [] default when not. Strings are sequences in Jinja, so `count` and `first`
  # on the raw input return its length and first character. Normalise it once
  # to the entity id, or "" when it is not configured.
  update_process_toggle: >-
    {%- set e = input_update_process_started_entity | default("") -%}
    {%- if e is string -%}
      {{ e | trim }}
    {%- elif e is sequence and e | count > 0 -%}
      {{ e | first | string | trim }}
    {%- endif -%}
  is_resume_after_restart: >
    {{
      update_process_toggle != "" and
      is_state(update_process_toggle, "on")
    }}
  is_out_of_schedule_mode: >
    {{
      trigger.id == "Out of schedule" or
      (
        (trigger.id == "HA Start" or trigger.id == "Automations reloaded") and
        (
          states.update
          | default([])
          | selectattr("state", "eq", "on")
          | selectattr("entity_id", "in", installable_entities)
          | selectattr("entity_id", "in", update_out_of_schedule)
          | rejectattr("entity_id", "in", input_update_exclusions)
          | list | count | int(0) > 0
        )
      )
    }}
  friendly_name: |
    {% set friendly_name_tmp = state_attr(this.entity_id, "friendly_name") | default("") %}
    {{
      friendly_name_tmp
      if friendly_name_tmp is string and friendly_name_tmp | length > 0
      else "Home Assistant Auto-update"
    }}
  notification_title: |
    {% if (input_notification_message_title == "friendly_name") %}
      {{ friendly_name }}
    {% elif (input_notification_message_title == "entity_id") %}
      {{ this.entity_id }}
    {% elif (input_notification_message_title != "blank" and
              input_notification_message_title is string and
              input_notification_message_title | length > 0) %}
      {{ input_notification_message_title }}
    {% else %}
      {{ "" }}
    {% endif %}
  non_installable_entities: >
    {% set ns = namespace(list=[]) %}
    {% for entity in states.update | default([]) %}
      {% if not (entity.attributes.supported_features | int(0)) | bitwise_and(1) %}
        {% set ns.list = ns.list + [entity.entity_id] %}
      {% endif %}
    {% endfor %}
    {{ ns.list }}
action:
  - alias: Refresh update entities
    action: homeassistant.update_entity
    data:
      entity_id: |
        {{
          states.update
          | default([])
          | rejectattr('entity_id', 'in', input_update_exclusions)
          | map(attribute='entity_id')
          | list
        }}
    continue_on_error: true

  - &recalc_update_list
    alias: Calculate the list of pending updates
    variables:
      firmware_update_entities: >
        {% if is_out_of_schedule_mode %}
          {# For out-of-schedule triggers, return empty list #}
          {# The update_out_of_schedule list will be added to combined_list directly #}
          []
        {% else %}
          {{
            states.update
            | default([])
            | selectattr("state", "eq", "on")
            | selectattr('attributes.device_class', 'defined')
            | selectattr('attributes.device_class', 'eq', 'firmware')
            | rejectattr('entity_id', 'in', input_update_exclusions)
            | map(attribute='entity_id')
            | list
          }}
        {% endif %}
      general_update_entities: >
        {% if is_out_of_schedule_mode %}
          {# For out-of-schedule triggers, return empty list #}
          {# The update_out_of_schedule list will be added to combined_list directly #}
          []
        {% elif input_update_inclusion_mode == "all" %}
          {{
            states.update
            | default([])
            | selectattr('state', 'eq', 'on')
            | rejectattr('entity_id', 'in', core_update_entity)
            | rejectattr('entity_id', 'in', os_update_entity)
            | rejectattr('entity_id', 'in', supervisor_update_entity)
            | rejectattr('entity_id', 'in', firmware_update_entities)
            | rejectattr('entity_id', 'in', input_update_exclusions)
            | map(attribute='entity_id')
            | list
          }}
        {% elif input_update_inclusion_mode == "specified" %}
          {{
            states.update
            | default([])
            | selectattr('state', 'eq', 'on')
            | selectattr('entity_id', 'in', input_update_inclusion_entity_list)
            | rejectattr('entity_id', 'in', core_update_entity)
            | rejectattr('entity_id', 'in', os_update_entity)
            | rejectattr('entity_id', 'in', supervisor_update_entity)
            | rejectattr('entity_id', 'in', firmware_update_entities)
            | rejectattr('entity_id', 'in', input_update_exclusions)
            | map(attribute='entity_id')
            | list
          }}
        {% elif input_update_inclusion_mode == "specified-single" %}
          {{
            states.update
            | default([])
            | selectattr('state', 'eq', 'on')
            | selectattr('entity_id', 'in', input_update_inclusion_entity_list)
            | rejectattr('entity_id', 'in', core_update_entity)
            | rejectattr('entity_id', 'in', os_update_entity)
            | rejectattr('entity_id', 'in', supervisor_update_entity)
            | rejectattr('entity_id', 'in', firmware_update_entities)
            | rejectattr('entity_id', 'in', input_update_exclusions)
            | map(attribute='entity_id')
            | list
            | first
            | default("")
          }}
        {% elif input_update_inclusion_mode == "searchfilter" %}
          {{
            states.update
            | default([])
            | selectattr('state', 'eq', 'on')
            | selectattr('entity_id', 'match', input_update_inclusion_entity_searchfilter)
            | rejectattr('entity_id', 'in', core_update_entity)
            | rejectattr('entity_id', 'in', os_update_entity)
            | rejectattr('entity_id', 'in', supervisor_update_entity)
            | rejectattr('entity_id', 'in', firmware_update_entities)
            | rejectattr('entity_id', 'in', input_update_exclusions)
            | map(attribute='entity_id')
            | list
          }}
        {% elif input_update_inclusion_mode == "searchfilter-single" %}
          {{
            states.update
            | default([])
            | selectattr('state', 'eq', 'on')
            | selectattr('entity_id', 'match', input_update_inclusion_entity_searchfilter)
            | rejectattr('entity_id', 'in', core_update_entity)
            | rejectattr('entity_id', 'in', os_update_entity)
            | rejectattr('entity_id', 'in', supervisor_update_entity)
            | rejectattr('entity_id', 'in', firmware_update_entities)
            | rejectattr('entity_id', 'in', input_update_exclusions)
            | map(attribute='entity_id')
            | list
            | first
            | default("")
          }}
        {% endif %}
      input_update_exclusions: >
            {% set exclusions = (temp_input_update_exclusions | default([])) + non_installable_entities %}

            {% set core_os_entities = [core_update_entity | default(""),
                                       os_update_entity | default(""),
                                       supervisor_update_entity | default("")]
                                      | reject('eq', '') | list %}
            {% if input_core_os_update_mode == 'ignore' %}
              {% set exclusions = exclusions + core_os_entities %}
            {% else %}
              {% set ns = namespace(entities = []) %}
              {% for entity in expand(core_os_entities)
                                | rejectattr('entity_id', 'in', exclusions)
                                | selectattr('state', 'eq', 'on') %}
                {% set entity_version_change = version(entity.attributes.latest_version | default(''))
                                                - version(entity.attributes.installed_version | default('')) %}
                {% if input_core_os_update_mode == 'patches' %}
                  {% if entity_version_change.major or
                        entity_version_change.minor or
                        (not entity_version_change.patch) %}
                    {% set ns.entities = ns.entities + [ entity.entity_id ] %}
                  {% endif %}
                {% elif input_core_os_update_mode == 'major_and_minor' %}
                  {% if (not entity_version_change.major) and (not entity_version_change.minor) %}
                    {% set ns.entities = ns.entities + [ entity.entity_id ] %}
                  {% endif %}
                {% endif %}
                {% if input_core_os_minimum_patch_version | int(0) > 0 and
                      entity.entity_id not in ns.entities %}
                  {% set patch = version(entity.attributes.latest_version | default('')).patch | int(-1) %}
                  {% if patch >= 0 and patch < input_core_os_minimum_patch_version | int(0) %}
                    {% set ns.entities = ns.entities + [ entity.entity_id ] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% set exclusions = exclusions + ns.entities %}
            {% endif %}

            {% if input_firmware_update_mode == 'ignore' %}
              {% set exclusions = exclusions + (firmware_update_entities
                                                if firmware_update_entities is sequence
                                                  and firmware_update_entities is not string
                                                else ([firmware_update_entities] if firmware_update_entities else [])) %}
            {% else %}
              {% set ns = namespace(entities = []) %}
              {% for entity in expand(firmware_update_entities)
                                | rejectattr('entity_id', 'in', exclusions)
                                | selectattr('state', 'eq', 'on') %}
                {% set entity_version_change = version(entity.attributes.latest_version | default(''))
                                                - version(entity.attributes.installed_version | default('')) %}
                {% if input_firmware_update_mode == 'patches' %}
                  {% if entity_version_change.major or
                        entity_version_change.minor or
                        (not entity_version_change.patch) %}
                    {% set ns.entities = ns.entities + [ entity.entity_id ] %}
                  {% endif %}
                {% elif input_firmware_update_mode == 'major_and_minor' %}
                  {% if (not entity_version_change.major) and (not entity_version_change.minor) %}
                    {% set ns.entities = ns.entities + [ entity.entity_id ] %}
                  {% endif %}
                {% endif %}
                {% if input_firmware_minimum_patch_version | int(0) > 0 and
                      entity.entity_id not in ns.entities %}
                  {% set patch = version(entity.attributes.latest_version | default('')).patch | int(-1) %}
                  {% if patch >= 0 and patch < input_firmware_minimum_patch_version | int(0) %}
                    {% set ns.entities = ns.entities + [ entity.entity_id ] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% set exclusions = exclusions + ns.entities %}
            {% endif %}

            {% if input_general_update_mode == 'ignore' %}
              {% set exclusions = exclusions + (general_update_entities
                                                if general_update_entities is sequence
                                                  and general_update_entities is not string
                                                else ([general_update_entities] if general_update_entities else [])) %}
            {% else %}
              {% set ns = namespace(entities = []) %}
              {% for entity in expand(general_update_entities)
                                | rejectattr('entity_id', 'in', exclusions)
                                | selectattr('state', 'eq', 'on') %}
                {% set entity_version_change = version(entity.attributes.latest_version | default(''))
                                              - version(entity.attributes.installed_version | default('')) %}
                {% if input_general_update_mode == 'patches' %}
                  {% if entity_version_change.major or
                        entity_version_change.minor or
                        (not entity_version_change.patch) %}
                    {% set ns.entities = ns.entities + [ entity.entity_id ] %}
                  {% endif %}
                {% elif input_general_update_mode == 'major_and_minor' %}
                  {% if (not entity_version_change.major) and (not entity_version_change.minor) %}
                    {% set ns.entities = ns.entities + [ entity.entity_id ] %}
                  {% endif %}
                {% endif %}
                {% if input_general_minimum_patch_version | int(0) > 0 and
                      entity.entity_id not in ns.entities %}
                  {% set patch = version(entity.attributes.latest_version | default('')).patch | int(-1) %}
                  {% if patch >= 0 and patch < input_general_minimum_patch_version | int(0) %}
                    {% set ns.entities = ns.entities + [ entity.entity_id ] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% set exclusions = exclusions + ns.entities %}
            {% endif %}

            {{ exclusions }}
      combined_list: >-
        {% set entities = namespace(list=[]) %}
        {%- if is_out_of_schedule_mode %}
          {# In out-of-schedule mode: ONLY include entities from update_out_of_schedule list #}
          {%- for entity in [update_out_of_schedule] %}
            {%- if entity is sequence and entity is not string %}
              {%- for item in entity %}
                {%- if item is string %}
                  {%- set entities.list = entities.list + [item] %}
                {%- endif %}
              {%- endfor %}
            {%- elif entity is string %}
              {%- set entities.list = entities.list + [entity] %}
            {%- endif %}
          {%- endfor %}
        {%- else %}
          {# Normal mode: Include all entity types #}
          {%- for entity in [firmware_update_entities, general_update_entities,
                            core_update_entity, os_update_entity, supervisor_update_entity] %}
            {%- if entity is sequence and entity is not string %}
              {%- for item in entity %}
                {%- if item is string %}
                  {%- set entities.list = entities.list + [item] %}
                {%- endif %}
              {%- endfor %}
            {%- elif entity is string %}
              {%- set entities.list = entities.list + [entity] %}
            {%- endif %}
          {%- endfor %}
        {%- endif %}
        {{ entities.list }}
      updates_pending: >-
        {% set updates = namespace(list=[]) %}
        {%- for entity in states.update %}
          {%- if (entity.state == "on" and
                  entity.entity_id in combined_list and
                  entity.entity_id not in input_update_exclusions and
                  (entity.attributes.supported_features | int(0)) | bitwise_and(1)) %}
            {%- set updates.list = updates.list + [entity.entity_id] %}
          {%- endif %}
        {%- endfor %}
        {{ updates.list }}
      pending_update_list: '{{ updates_pending }}'
      updates_pending_count: '{{ updates_pending | list | count | int(0) }}'

  - alias: Snapshot the updates found at the start of the run
    variables:
      update_list: '{{ updates_pending }}'
      updates_list: '{{ updates_pending }}'
      is_there_anything_to_update: '{{ updates_pending_count > 0 }}'
      install_log_found_entities: '{{ updates_pending }}'

  - alias: Preparation  # Inform logbook and notify which update automation is running
    sequence:
      - alias: Set log message (starting)
        variables:
          log_message: '{{ friendly_name }} is {{ "re" if is_resume_after_restart else ""}}starting'
      - &logbook_update
        alias: Write to logbook (if verbose logging is on)
        if:
          - alias: Verbose logging is on
            condition: template
            value_template: '{{ input_verbose_logging_bool }}'
        then:
          - alias: Logbook - Update
            action: logbook.log
            data:
              name: Auto-update
              entity_id: '{{ this.entity_id }}'
              message: '{{ log_message }}'
            continue_on_error: true
        continue_on_error: true

  - alias: Report list of updates  # Combined starting + list of updates notification
    if:
      - &cond_updates_found
        alias: Updates were found
        condition: template
        value_template: '{{ is_there_anything_to_update }}'
      - &cond_in_update_window
        alias: Inside the schedule, or running out-of-schedule updates
        condition: or
        conditions:
          - alias: Running out-of-schedule updates
            condition: template
            value_template: '{{ is_out_of_schedule_mode }}'
          - alias: Schedule is on (or no schedule is set)
            condition: state
            entity_id: !input schedule_entity
            state: 'on'
    then:
      - alias: Set log message (list of updates)
        variables:
          log_message: >
            {{ friendly_name }} is {{ "re" if is_resume_after_restart else "" }}starting

            List of updates:

            - {{ states.update
                | selectattr('state', 'eq', 'on')
                | selectattr('entity_id', 'in', updates_pending)
                | rejectattr('entity_id', 'in', input_update_exclusions)
                | map(attribute='name') | list | join("\n- ") }}
      - *logbook_update
      - alias: Set install log entry (updates found)
        variables:
          install_log_is_error: false
          install_log_message: |-
            {%- set found = states.update
                | selectattr('state', 'eq', 'on')
                | selectattr('entity_id', 'in', updates_pending)
                | rejectattr('entity_id', 'in', input_update_exclusions)
                | list -%}
            {{ "Resumed after restart, found" if is_resume_after_restart else "Found" }}
            {{- " " ~ (found | count) }} update{{ "s" if found | count != 1 }}:
            {%- for u in found %}
              - {{ u.name }}: {{ u.attributes.installed_version | default("?", true) }} -> {{ u.attributes.latest_version | default("?", true) }}
            {%- endfor %}
      - &write_install_log
        alias: Write to install log
        sequence:
          - alias: Build the install log line
            variables:
              install_log_line: >-
                {{ now().strftime("%Y-%m-%d %H:%M:%S") }} [{{ friendly_name }}]
                {{- " ERROR:" if install_log_is_error else "" }} {{ install_log_message }}
          - alias: Append to install log file (if configured)
            if:
              - alias: Install log file is configured
                condition: template
                value_template: '{{ input_install_log_entity is string and input_install_log_entity | length > 0 }}'
            then:
              - alias: Install log - Append entry
                action: notify.send_message
                target:
                  entity_id: '{{ input_install_log_entity }}'
                data:
                  message: '{{ install_log_line }}'
                continue_on_error: true
          - alias: Append to error log file (if this is an error and it is configured)
            if:
              - alias: This entry is an error
                condition: template
                value_template: '{{ install_log_is_error }}'
              - alias: Error log file is configured
                condition: template
                value_template: '{{ input_error_log_entity is string and input_error_log_entity | length > 0 }}'
            then:
              - alias: Error log - Append entry
                action: notify.send_message
                target:
                  entity_id: '{{ input_error_log_entity }}'
                data:
                  message: '{{ install_log_line }}'
                continue_on_error: true
      - alias: Send starting notification (if selected)
        if:
          - alias: Starting notifications are selected
            condition: template
            value_template: '{{ "starting" in input_notification_select_notifications }}'
        then:
          - &send_notification
            alias: Send notification
            sequence:
              - alias: Set notification message
                variables:
                  notification_message: '{{ log_message }}'
              - alias: Send notification (if a notify entity is configured)
                if:
                  - condition: template
                    value_template: '{{ input_notification_entity | length > 0 }}'
                    alias: Check if notification entity is configured
                then:
                  - alias: Notify - Send message
                    action: notify.send_message
                    target:
                      entity_id: '{{ input_notification_entity }}'
                    data:
                      title: '{{ notification_title }}'
                      message: '{{ notification_message }}'
                    continue_on_error: true
      - alias: "Run custom starting actions"
        continue_on_error: true
        sequence: !input notification_action_starting
    else:
      - alias: Set log message (nothing to update)
        variables:
          log_message: "{{ friendly_name }} started but there's nothing to update"
      - *logbook_update

  - alias: Set ON helper flag
    if:
      - &cond_helper_flag_configured
        alias: Update process toggle is configured
        condition: template
        value_template: '{{ update_process_toggle != "" }}'
      - alias: Schedule is on (or no schedule is set)
        condition: state
        entity_id: !input schedule_entity
        state: 'on'
    then:
      - alias: Turn on the update process toggle
        action: input_boolean.turn_on
        target:
          entity_id: !input update_process_started_entity
        continue_on_error: true

  - alias: Pre-update actions
    if:
      - *cond_updates_found
      - *cond_in_update_window
      - &cond_not_resuming
        alias: Not resuming after a restart
        condition: template
        value_template: '{{ not is_resume_after_restart }}'
    then:
      - alias: Read the pre-update actions input
        variables:
          input_actions_pre_update: !input actions_pre_update
      - alias: Pre-update actions are configured
        condition: template
        value_template: '{{ input_actions_pre_update is sequence }}'
      - *recalc_update_list
      - alias: Set log message (running pre-update actions)
        variables:
          log_message: 'Running pre-update actions...'
      - *logbook_update

      - alias: "Run pre-update actions"
        continue_on_error: true
        sequence: !input actions_pre_update

      - alias: Set log message (pre-update actions completed)
        variables:
          log_message: "Pre-update actions completed"
      - *logbook_update

  - alias: Wait for backup system to be idle  # Wait if a backup is already in progress
    if:
      - *cond_updates_found
      - *cond_in_update_window
    then:
      - alias: Read the backup inputs
        variables:
          input_run_during_backup: !input run_during_backup
          input_backup_timeout_minutes: !input backup_timeout
          input_backup_timeout: '{{ input_backup_timeout_minutes | int(60) }}'
      - alias: Wait if a backup is already running
        if:
          - alias: Backup state sensor is configured
            condition: template
            value_template: '{{ input_run_during_backup is string and input_run_during_backup | length > 0 }}'
          - alias: Backup system is not idle
            condition: template
            value_template: '{{ not is_state(input_run_during_backup, "idle") }}'
        then:
          - alias: Stop if the backup state sensor is unavailable
            if:
              - alias: Backup state sensor is unknown or unavailable
                condition: template
                value_template: >-
                  {{
                    is_state(input_run_during_backup, "unknown") or
                    is_state(input_run_during_backup, "unavailable")
                  }}
            then:
              - alias: Set log message (backup sensor unavailable)
                variables:
                  log_message: >
                    Backup state sensor is {{ states(input_run_during_backup) }}.
                    Cannot determine if a backup is in progress. Stopping.
              - *logbook_update
              - &install_log_error_from_log_message
                alias: Write the log message to the install log as an error
                sequence:
                  - alias: Set install log entry (error)
                    variables:
                      install_log_is_error: true
                      install_log_message: '{{ log_message | trim }}'
                  - *write_install_log
              - &send_backup_or_error_notification
                alias: Send backup/error notification (if selected)
                if:
                  - alias: Backup or error notifications are selected
                    condition: template
                    value_template: >-
                      {{
                        "backup" in input_notification_select_notifications or
                        "errors" in input_notification_select_notifications
                      }}
                then:
                  - *send_notification
              - &reset_helper_flag
                alias: "Reset helper flag before stopping"
                if:
                  - *cond_helper_flag_configured
                then:
                  - alias: Turn off the update process toggle
                    action: input_boolean.turn_off
                    target:
                      entity_id: !input update_process_started_entity
                    continue_on_error: true
              - stop: "Backup state sensor is unavailable"
          - alias: Set log message (backup system busy)
            variables:
              log_message: >
                Backup system is busy ({{ states(input_run_during_backup) }}).
                Waiting up to {{ input_backup_timeout }} minutes for it to become idle...
          - *logbook_update
          - &send_backup_notification
            alias: Send backup notification (if selected)
            if:
              - alias: Backup notifications are selected
                condition: template
                value_template: '{{ "backup" in input_notification_select_notifications }}'
            then:
              - *send_notification
          - alias: "Wait for backup system to become idle"
            wait_for_trigger:
              - trigger: state
                entity_id: !input run_during_backup
                to: "idle"
            continue_on_timeout: true
            timeout:
              minutes: "{{ input_backup_timeout | int(60) }}"
          - alias: Stop if the backup system is still busy
            if:
              - alias: Backup system is still not idle
                condition: template
                value_template: '{{ not is_state(input_run_during_backup, "idle") }}'
            then:
              - alias: Set log message (backup system still busy)
                variables:
                  log_message: "Backup system did not become idle in time. Stopping."
              - *logbook_update
              - *install_log_error_from_log_message
              - *send_backup_or_error_notification
              - *reset_helper_flag
              - stop: "Backup system did not become idle in time"

  - alias: Backup
    if:
      - *cond_updates_found
      - *cond_in_update_window
      - *cond_not_resuming
    then:
      - *recalc_update_list
      - alias: Read the backup inputs
        variables:
          input_backup_mode: !input backup_mode
          input_backup_timeout_minutes: !input backup_timeout
          input_backup_timeout: '{{ input_backup_timeout_minutes | int(60) }}'
          input_run_during_backup: !input run_during_backup
          input_last_backup_timestamp_entity: !input last_backup_timestamp_entity
          temp_max_backup_age: !input max_backup_age
          input_max_backup_age_seconds: >
            {{
              timedelta(
                days=temp_max_backup_age.days,
                hours=temp_max_backup_age.hours,
                minutes=temp_max_backup_age.minutes,
                seconds=temp_max_backup_age.seconds
              ).total_seconds()
            }}

      - alias: Backup section
        if:
          - alias: Backup mode is not "never"
            condition: template
            value_template: '{{ input_backup_mode != "never" }}'
        then:
          - alias: Validate auto mode prerequisites
            if:
              - alias: Backup mode is "auto"
                condition: template
                value_template: '{{ input_backup_mode == "auto" }}'
              - alias: Backup state sensor or last backup sensor is missing
                condition: template
                value_template: >-
                  {{
                    (input_run_during_backup is not string or input_run_during_backup | length == 0) or
                    (input_last_backup_timestamp_entity is not string or input_last_backup_timestamp_entity | length == 0)
                  }}
            then:
              - alias: Set log message (auto backup misconfigured)
                variables:
                  log_message: >
                    ERROR: Auto backup mode requires both the Backup state sensor and
                    Last successful automatic backup sensor to be configured. Stopping.
              - *logbook_update
              - *install_log_error_from_log_message
              - &send_error_notification
                alias: Send error notification (if selected)
                if:
                  - alias: Error notifications are selected
                    condition: template
                    value_template: '{{ "errors" in input_notification_select_notifications }}'
                then:
                  - *send_notification
              - alias: "Run custom error actions (backup misconfigured)"
                continue_on_error: true
                sequence: !input notification_action_errors
              - *reset_helper_flag
              - stop: "Auto backup mode misconfigured"

          - alias: Determine if a backup is needed
            variables:
              needs_backup: >
                {% if input_backup_mode == "always" %}
                  {{ true }}
                {% elif input_backup_mode == "auto" %}
                  {% set last_backup_state = states(input_last_backup_timestamp_entity) %}
                  {% if last_backup_state in ["unknown", "unavailable", ""] or
                        last_backup_state is none %}
                    {{ true }}
                  {% elif input_max_backup_age_seconds > 0 and
                          (as_timestamp(now()) - as_timestamp(last_backup_state)) > input_max_backup_age_seconds %}
                    {{ true }}
                  {% else %}
                    {{ false }}
                  {% endif %}
                {% else %}
                  {{ false }}
                {% endif %}

          - alias: Log backup age check result (auto mode)
            if:
              - alias: Backup mode is "auto"
                condition: template
                value_template: '{{ input_backup_mode == "auto" }}'
            then:
              - alias: Log whether a backup is needed
                if:
                  - &cond_needs_backup
                    alias: A backup is needed
                    condition: template
                    value_template: '{{ needs_backup }}'
                then:
                  - alias: Set log message (backup needed)
                    variables:
                      log_message: >
                        {% set last_backup_state = states(input_last_backup_timestamp_entity) %}
                        {% if last_backup_state in ["unknown", "unavailable", ""] or
                              last_backup_state is none %}
                          Backup timestamp sensor is {{ last_backup_state }}. Creating a backup to be safe.
                        {% else %}
                          Last backup is too old
                          ({{ relative_time(as_datetime(last_backup_state)) }} ago).
                          Creating a new backup...
                        {% endif %}
                  - *logbook_update
                else:
                  - alias: Set log message (recent backup found)
                    variables:
                      log_message: "Recent backup detected. Skipping backup creation."
                  - *logbook_update

          - alias: "Create backup"
            continue_on_error: true
            if:
              - *cond_needs_backup
              - alias: No backup has been made yet in this update window
                condition: template
                # Not the live toggle state: "Set ON helper flag" has already
                # turned it on in this run. A toggle that was on at the start
                # means this run resumes one that already backed up.
                value_template: '{{ not is_resume_after_restart }}'
            then:
              - alias: Turn on the update process toggle (if configured)
                if:
                  - alias: Update process toggle is configured
                    condition: template
                    value_template: '{{ update_process_toggle != "" }}'
                then:
                  - alias: Turn on the update process toggle
                    action: input_boolean.turn_on
                    target:
                      entity_id: "{{ input_update_process_started_entity }}"
                    continue_on_error: true
              - alias: Set log message (backing up)
                variables:
                  log_message: "Backing up Home Assistant"
              - *logbook_update
              - *send_backup_notification
              - alias: "Run custom backup actions (starting)"
                continue_on_error: true
                sequence: !input notification_action_backup

              - alias: "Capture the last backup timestamp before the backup call"
                variables:
                  has_backup_timestamp_entity: >
                    {{
                      input_last_backup_timestamp_entity is string and
                      input_last_backup_timestamp_entity | length > 0
                    }}
                  backup_timestamp_before: >
                    {{ states(input_last_backup_timestamp_entity) if has_backup_timestamp_entity else "" }}

              - alias: "Call backup service"
                action: backup.create_automatic
                continue_on_error: true

              # `backup.create_automatic` blocks until the backup is finished,
              # so the backup may already be completed at this point.
              - alias: "Check if the backup completed during the service call"
                variables:
                  backup_timestamp_after: >
                    {{ states(input_last_backup_timestamp_entity) if has_backup_timestamp_entity else "" }}
                  is_backup_confirmed: >
                    {{
                      has_backup_timestamp_entity and
                      backup_timestamp_after not in ["unknown", "unavailable", ""] and
                      backup_timestamp_after != backup_timestamp_before
                    }}

              - alias: "Wait for backup to complete"
                if:
                  - alias: Backup confirmed by a new timestamp
                    condition: template
                    value_template: '{{ is_backup_confirmed }}'
                then:  # Backup already confirmed by a new timestamp, no need to wait
                  - &backup_completed
                    alias: "Backup completed"
                    sequence:
                      - alias: Set log message (backup completed)
                        variables:
                          log_message: "Backup completed successfully"
                      - *logbook_update
                      - alias: Set install log entry (backup completed)
                        variables:
                          install_log_is_error: false
                          install_log_message: "Backup completed"
                      - *write_install_log
                      - *send_backup_notification
                      - alias: "Run custom backup actions (completed)"
                        continue_on_error: true
                        sequence: !input notification_action_backup
                else:  # Not confirmed yet, fall back to the backup state sensor (or to a fixed delay)
                  - alias: Confirm the backup with the backup state sensor
                    if:
                      - alias: Backup state sensor is configured
                        condition: template
                        value_template: '{{ input_run_during_backup is string and input_run_during_backup | length > 0 }}'
                    then:
                      - alias: Set log message (waiting for backup to start)
                        variables:
                          log_message: "Backup triggered. Waiting for backup to start..."
                      - *logbook_update
                      - alias: "Wait for backup state to leave idle (confirms backup started)"
                        wait_for_trigger:
                          - trigger: state
                            entity_id: !input run_during_backup
                            from: "idle"
                        continue_on_timeout: true
                        timeout:
                          seconds: 30

                      # A fast backup can start and finish within the wait above, leaving the
                      # sensor back at "idle", so the timestamp is read again before failing.
                      - alias: "Check the backup timestamp again after the wait"
                        variables:
                          backup_timestamp_after_wait: >
                            {{ states(input_last_backup_timestamp_entity) if has_backup_timestamp_entity else "" }}
                          is_backup_confirmed_after_wait: >
                            {{
                              has_backup_timestamp_entity and
                              backup_timestamp_after_wait not in ["unknown", "unavailable", ""] and
                              backup_timestamp_after_wait != backup_timestamp_before
                            }}
                      - alias: Check whether the backup finished during the wait
                        if:
                          - alias: Backup confirmed by a new timestamp after the wait
                            condition: template
                            value_template: '{{ is_backup_confirmed_after_wait }}'
                        then:  # Backup finished during the wait
                          - *backup_completed
                        else:
                          - alias: Check whether the backup started
                            if:
                              - alias: Backup state sensor never left idle
                                condition: template
                                value_template: '{{ is_state(input_run_during_backup, "idle") }}'
                            then:  # Sensor never left idle and no new backup timestamp was detected
                              - alias: Stop, or warn if the backup cannot be confirmed
                                if:
                                  - alias: Last backup timestamp sensor is configured
                                    condition: template
                                    value_template: '{{ has_backup_timestamp_entity }}'
                                then:  # Timestamp sensor available, so this is a genuine failure
                                  - alias: Set log message (no backup detected)
                                    variables:
                                      log_message: >
                                        ERROR: No backup was detected within 30 seconds and the
                                        "Last successful automatic backup" sensor did not change.
                                        Stopping to avoid running updates without a backup.
                                  - *logbook_update
                                  - *install_log_error_from_log_message
                                  - *send_backup_or_error_notification
                                  - alias: "Run custom error actions (backup may not have started)"
                                    continue_on_error: true
                                    sequence: !input notification_action_errors
                                  - *reset_helper_flag
                                  - stop: "Backup did not start"
                                else:  # Without the timestamp sensor the backup cannot be confirmed
                                  - alias: Set log message (backup not confirmed)
                                    variables:
                                      log_message: >
                                        WARNING: The backup state sensor is still idle.
                                        The backup has probably completed during the service call,
                                        but this cannot be confirmed without the
                                        "Last successful automatic backup" sensor. Continuing with updates...
                                  - *logbook_update
                                  - *install_log_error_from_log_message
                                  - *send_backup_or_error_notification
                                  - alias: "Run custom error actions (backup could not be confirmed)"
                                    continue_on_error: true
                                    sequence: !input notification_action_errors
                            else:  # Backup is still running
                              - alias: Stop if the backup state sensor became unavailable
                                if:
                                  - alias: Backup state sensor is unknown or unavailable
                                    condition: template
                                    value_template: >-
                                      {{
                                        is_state(input_run_during_backup, "unknown") or
                                        is_state(input_run_during_backup, "unavailable")
                                      }}
                                then:
                                  - alias: Set log message (backup sensor fault)
                                    variables:
                                      log_message: >
                                        ERROR: Backup state sensor changed to {{ states(input_run_during_backup) }}
                                        instead of a backup state. Stopping.
                                  - *logbook_update
                                  - *install_log_error_from_log_message
                                  - *send_backup_or_error_notification
                                  - alias: "Run custom error actions (backup sensor fault)"
                                    continue_on_error: true
                                    sequence: !input notification_action_errors
                                  - *reset_helper_flag
                                  - stop: "Backup state sensor became unavailable"
                              - alias: Set log message (backup started)
                                variables:
                                  log_message: >
                                    Backup started ({{ states(input_run_during_backup) }}).
                                    Waiting for backup system to return to idle...
                              - *logbook_update
                              - alias: "Wait for backup system to become idle after backup"
                                wait_for_trigger:
                                  - trigger: state
                                    entity_id: !input run_during_backup
                                    to: "idle"
                                continue_on_timeout: true
                                timeout:
                                  minutes: "{{ input_backup_timeout | int(60) }}"
                              - alias: Check whether the backup finished in time
                                if:
                                  - alias: Backup system is still not idle
                                    condition: template
                                    value_template: '{{ not is_state(input_run_during_backup, "idle") }}'
                                then:
                                  - alias: Set log message (backup timed out)
                                    variables:
                                      log_message: >
                                        WARNING: Backup did not complete within {{ input_backup_timeout }} minutes.
                                        Continuing with updates...
                                  - *logbook_update
                                  - *install_log_error_from_log_message
                                  - *send_backup_or_error_notification
                                  - alias: "Run custom error actions (backup timeout)"
                                    continue_on_error: true
                                    sequence: !input notification_action_errors
                                else:
                                  - *backup_completed
                    else:  # No backup state sensor configured
                      - alias: Set log message (waiting a fixed time for the backup)
                        variables:
                          log_message: >
                            Backup triggered.
                            No backup state sensor configured, waiting {{ input_backup_timeout | int(60) }} minutes...
                      - *logbook_update
                      - alias: "Wait for the backup (fallback delay)"
                        delay:
                          minutes: "{{ input_backup_timeout | int(60) }}"
                      - alias: Set log message (backup wait finished)
                        variables:
                          log_message: "Backup wait time finished. Continuing..."
                      - *logbook_update
                      - alias: Set install log entry (backup started, not confirmed)
                        variables:
                          install_log_is_error: false
                          install_log_message: "Backup started (not confirmed, no backup state sensor configured)"
                      - *write_install_log
                      - *send_backup_notification
                      - alias: "Run custom backup actions (fallback wait done)"
                        continue_on_error: true
                        sequence: !input notification_action_backup

  - alias: Update generic
    if:
      - *cond_updates_found
      - *cond_in_update_window
    then:
      - *recalc_update_list
      - alias: Set log message (update generic items)
        variables:
          log_message: "Update generic items"
      - *logbook_update
      - alias: Set log message (starting standard updates)
        variables:
          log_message: 'Starting sequence of standard updates...'
      - *logbook_update
      - &send_update_progress_notification
        alias: Send update progress notification (if selected)
        if:
          - alias: Update progress notifications are selected
            condition: template
            value_template: '{{ "update_progress" in input_notification_select_notifications }}'
        then:
          - *send_notification

      - alias: "Update - Generic"
        continue_on_error: true
        repeat:
          while:
            - alias: General updates are enabled
              condition: template
              value_template: "{{ input_general_update_mode in ['patches', 'major_and_minor', 'all'] }}"
            - &cond_still_in_update_window
              alias: Still inside the schedule, or running out-of-schedule updates
              condition: or
              conditions:
                - alias: Running out-of-schedule updates
                  condition: template
                  value_template: '{{ is_out_of_schedule_mode }}'
                - alias: Schedule is on (or no schedule is set)
                  condition: state
                  entity_id: !input schedule_entity
                  state: "on"
            - alias: General updates are still pending
              condition: template
              value_template: >
                {{ ( states.update
                  | selectattr('state', 'eq', 'on')
                  | selectattr('entity_id', 'in', updates_pending)
                  | rejectattr('entity_id', 'in', core_update_entity)
                  | rejectattr('entity_id', 'in', os_update_entity)
                  | rejectattr('entity_id', 'in', firmware_update_entities)
                  | rejectattr('entity_id', 'in', input_update_exclusions)
                  | map(attribute='entity_id')
                  | list | count | int(0) ) > 0
                }}
          sequence:
            - alias: List pending general updates
              variables:
                updates_pending: >
                  {{ states.update
                    | selectattr('state', 'eq', 'on')
                    | selectattr('entity_id', 'in', updates_pending)
                    | rejectattr('entity_id', 'in', core_update_entity)
                    | rejectattr('entity_id', 'in', os_update_entity)
                    | rejectattr('entity_id', 'in', firmware_update_entities)
                    | rejectattr('entity_id', 'in', input_update_exclusions)
                    | map(attribute='entity_id')
                    | list
                  }}
            - &get_next_update_entity
              alias: Pick the next update to install
              variables:
                current_update_entity: '{{ updates_pending[0] }}'
                current_update_entity_friendly_name: |
                  {{ state_attr(current_update_entity, "friendly_name") | default(current_update_entity) }}
                current_update_from_version: '{{ state_attr(current_update_entity, "installed_version") | default("?", true) }}'
                current_update_to_version: '{{ state_attr(current_update_entity, "latest_version") | default("?", true) }}'

            - &log_updating
              alias: Log updating
              sequence:
                - alias: Set log message (updating)
                  variables:
                    log_message: 'Updating "{{ current_update_entity_friendly_name }}"...'
                - *logbook_update
                - alias: Set install log entry (installing)
                  variables:
                    install_log_is_error: false
                    install_log_message: >-
                      Installing {{ current_update_entity_friendly_name }}:
                      {{ current_update_from_version }} -> {{ current_update_to_version }}
                - *write_install_log
                - *send_update_progress_notification
                - alias: "Run custom update progress actions"
                  continue_on_error: true
                  sequence: !input notification_action_update_progress

            - &update_install
              alias: "Update - Install"
              continue_on_error: true
              action: update.install
              data: {}
              target:
                entity_id: '{{ current_update_entity }}'

            - &update_wait
              alias: "Update - Wait"
              sequence:
                - alias: Wait
                  continue_on_error: true
                  wait_template: '{{ is_state(current_update_entity, "off") }}'
                  continue_on_timeout: true
                  timeout: !input update_timeout
                - alias: Check whether the update finished in time
                  if:
                    - alias: Update finished before the timeout
                      condition: template
                      value_template: '{{ wait.completed }}'
                  then:
                    - alias: Set log message (update succeeded)
                      variables:
                        log_message: '"{{ current_update_entity_friendly_name }}" updated successfully'
                    - *logbook_update
                    - alias: Set install log entry (installed)
                      variables:
                        install_log_is_error: false
                        install_log_message: >-
                          Installed {{ current_update_entity_friendly_name }}:
                          {{ current_update_from_version }} -> {{
                            state_attr(current_update_entity, "installed_version") | default(current_update_to_version, true)
                          }}
                    - *write_install_log
                    - *send_update_progress_notification
                    - alias: "Run custom update progress actions (success)"
                      continue_on_error: true
                      sequence: !input notification_action_update_progress
                  else:
                    - alias: Set log message (update timed out)
                      variables:
                        log_message: 'ERROR: "{{ current_update_entity_friendly_name }}" update timed out'
                    - *logbook_update
                    - alias: Set install log entry (update timed out)
                      variables:
                        install_log_is_error: true
                        install_log_message: >-
                          {{ current_update_entity_friendly_name }}
                          {{ current_update_from_version }} -> {{ current_update_to_version }}
                          did not finish within {{ input_update_timeout }} seconds
                          (installed version is now {{ state_attr(current_update_entity, "installed_version") | default("?", true) }})
                    - *write_install_log
                    - alias: Send update progress/error notification (if selected)
                      if:
                        - alias: Update progress or error notifications are selected
                          condition: template
                          value_template: >-
                            {{
                              "update_progress" in input_notification_select_notifications or
                              "errors" in input_notification_select_notifications
                            }}
                      then:
                        - *send_notification
                    - alias: "Run custom error actions (update timeout)"
                      continue_on_error: true
                      sequence: !input notification_action_errors

  - alias: Devices firmware
    if:
      - *cond_updates_found
      - *cond_in_update_window
    then:
      - *recalc_update_list
      - alias: Set log message (device firmware)
        variables:
          log_message: "Device's firmware"
      - *logbook_update

      - alias: Set log message (starting firmware updates)
        variables:
          log_message: 'Starting sequence of Devices firmware update'
      - *logbook_update
      - *send_update_progress_notification

      - alias: "Update - Devices firmware"
        continue_on_error: true
        repeat:
          while:
            - alias: Firmware updates are enabled
              condition: template
              value_template: "{{ input_firmware_update_mode in ['patches', 'major_and_minor', 'all'] }}"
            - *cond_still_in_update_window
            - alias: Firmware updates are still pending
              condition: template
              value_template: >
                {{ ( states.update
                  | selectattr('state', 'eq', 'on')
                  | selectattr('entity_id', 'in', firmware_update_entities)
                  | rejectattr('entity_id', 'in', input_update_exclusions)
                  | map(attribute='entity_id')
                  | list | count | int(0) ) > 0
                }}
          sequence:
            - alias: List pending firmware updates
              variables:
                updates_pending: >
                  {{ states.update
                    | selectattr('state', 'eq', 'on')
                    | selectattr('entity_id', 'in', firmware_update_entities)
                    | map(attribute='entity_id')
                    | list
                  }}

            - *get_next_update_entity
            - *log_updating
            - *update_install
            - *update_wait

  - alias: Update core
    if:
      - *cond_updates_found
      - *cond_in_update_window
    then:
      - *recalc_update_list
      - alias: Set log message (update core)
        variables:
          log_message: "Update Core"
      - *logbook_update
      - alias: Set log message (starting core updates)
        variables:
          log_message: 'Starting sequence of core items updates...'
      - *logbook_update
      - *send_update_progress_notification

      - alias: "Update - Core"
        continue_on_error: true
        repeat:
          while:
            - &cond_core_os_updates_enabled
              alias: Core/OS updates are enabled
              condition: template
              value_template: "{{ input_core_os_update_mode in ['patches', 'major_and_minor', 'all'] }}"
            - *cond_still_in_update_window
            - alias: A core update is still pending
              condition: template
              value_template: >
                {{ ( states.update
                  | selectattr('state', 'eq', 'on')
                  | selectattr('entity_id', 'in', core_update_entity)
                  | rejectattr('entity_id', 'in', input_update_exclusions)
                  | map(attribute='entity_id')
                  | list | count | int(0) ) > 0
                }}
          sequence:

            - alias: List pending core updates
              variables:
                updates_pending: >
                  {{ states.update
                    | selectattr('state', 'eq', 'on')
                    | selectattr('entity_id', 'in', core_update_entity)
                    | rejectattr('entity_id', 'in', input_update_exclusions)
                    | map(attribute='entity_id')
                    | list
                  }}

            - *get_next_update_entity
            - *log_updating
            - *update_install
            - *update_wait

  - alias: Update OS
    if:
      - *cond_updates_found
      - *cond_in_update_window
    then:
      - *recalc_update_list
      - alias: Set log message (update OS)
        variables:
          log_message: "Update OS"
      - *logbook_update
      - alias: Set log message (starting OS update)
        variables:
          log_message: "Starting sequence of OS update"
      - *logbook_update
      - *send_update_progress_notification

      - alias: "Update - OS"
        continue_on_error: true
        repeat:
          while:
            - *cond_core_os_updates_enabled
            - *cond_still_in_update_window
            - alias: An OS update is still pending
              condition: template
              value_template: >
                {{ ( states.update
                  | selectattr('state', 'eq', 'on')
                  | selectattr('entity_id', 'in', os_update_entity)
                  | rejectattr('entity_id', 'in', input_update_exclusions)
                  | map(attribute='entity_id')
                  | list | count | int(0) ) > 0
                }}
          sequence:

            - alias: List pending OS updates
              variables:
                updates_pending: >
                  {{ states.update
                    | selectattr('state', 'eq', 'on')
                    | selectattr('entity_id', 'in', os_update_entity)
                    | rejectattr('entity_id', 'in', input_update_exclusions)
                    | map(attribute='entity_id')
                    | list
                  }}

            - *get_next_update_entity
            - *log_updating
            - *update_install
            - *update_wait

  - alias: Update - Remaining  # Update all remaining items => this chaches up if some update item was left behind
    continue_on_error: true
    if:
      - *cond_updates_found
      - *cond_in_update_window
    then:
      - *recalc_update_list
      - alias: Set log message (updating remaining items)
        variables:
          log_message: "Updating all remaining items (if any)"
      - *logbook_update
      - alias: List remaining updates
        variables:
          remaining_items: |
            {{ states.update
            | selectattr('state', 'eq', 'on')
            | selectattr('entity_id', 'in', updates_pending)
            | rejectattr('entity_id', 'in', input_update_exclusions)
            | map(attribute='entity_id')
            | list
            }}
          remaining_items_count: '{{ remaining_items | count if remaining_items is sequence else 0 }}'

      - alias: There are remaining updates
        condition: template
        value_template: '{{ remaining_items_count > 0 }}'

      - alias: Set log message (remaining updates)
        variables:
          log_message: |
            Remaining updates:
            - {{ remaining_items | join("\n- ") }}

      - *logbook_update
      - alias: Set install log entry (installing remaining updates)
        variables:
          install_log_is_error: false
          install_log_message: |-
            Installing {{ remaining_items_count }} remaining update{{ "s" if remaining_items_count != 1 }} together:
            {%- for e in remaining_items %}
              - {{ state_attr(e, "friendly_name") | default(e, true) }}:
                {{- " " ~ state_attr(e, "installed_version") | default("?", true) }} -> {{ state_attr(e, "latest_version") | default("?", true) }}
            {%- endfor %}
      - *write_install_log
      - *send_update_progress_notification

      - alias: "Update - Remaining - Install"
        continue_on_error: true
        service: update.install
        data: {}
        target:
          entity_id: >-
            {{ states.update
            | selectattr('state', 'eq', 'on')
            | selectattr('entity_id', 'in', updates_pending)
            | rejectattr('entity_id', 'in', input_update_exclusions)
            | map(attribute='entity_id')
            | list
            }}
      - alias: "Update - Remaining - Wait"
        continue_on_error: true
        wait_template: >-
          {{
            (
              states.update
              | selectattr('state', 'eq', 'on')
              | selectattr('entity_id', 'in', updates_pending)
              | rejectattr('entity_id', 'in', input_update_exclusions)
              | list
              | count
              | int(0)
            ) < 1
          }}
        continue_on_timeout: true
        timeout: !input update_timeout

  - alias: Finishing
    if:
      - *cond_updates_found
      - *cond_in_update_window
    then:
      - *recalc_update_list
      - alias: Set log message (finishing)
        variables:
          log_message: "Finishing update process"
      - *logbook_update

      - alias: List updates that are still pending
        variables:
          remaining_updates: |
            {{
              states.update
              | selectattr('state', 'eq', 'on')
              | selectattr('entity_id', 'in', updates_pending)
              | rejectattr('entity_id', 'in', input_update_exclusions)
              | map(attribute='name')
              | list
            }}
          remaining_updates_count: '{{ remaining_updates | count | int(0) }}'
      - alias: Report remaining updates
        if:
          - alias: Some updates are still pending
            condition: template
            value_template: '{{ remaining_updates_count > 0 }}'
        then:
          - alias: Set log message (remaining updates)
            variables:
              log_message: |
                Remaining updates:
                - {{ remaining_updates | join("\n- ") }}
          - *logbook_update
          - alias: Send done/error notification (if selected)
            if:
              - alias: Done or error notifications are selected
                condition: template
                value_template: >-
                  {{
                    "done" in input_notification_select_notifications or
                    "errors" in input_notification_select_notifications
                  }}
            then:
              - *send_notification
          - alias: "Run custom error actions (remaining updates)"
            continue_on_error: true
            sequence: !input notification_action_errors
        else:
          - alias: Set log message (nothing remaining)
            variables:
              log_message: "No remaining items to be updated"
          - *logbook_update

  # Its own step, not part of "Finishing", so the summary is also written when the schedule
  # closed mid-run. A restart during the run (e.g. a Core update) ends it before this point.
  - alias: Write the run summary to the install log
    if:
      - *cond_updates_found
    then:
      - alias: Compare the updates found at the start with what is still pending
        variables:
          install_log_not_installed: >-
            {{
              states.update
              | selectattr('state', 'eq', 'on')
              | selectattr('entity_id', 'in', install_log_found_entities)
              | map(attribute='entity_id')
              | list
            }}
          install_log_found_count: '{{ install_log_found_entities | count }}'
          install_log_installed_count: '{{ install_log_found_count - install_log_not_installed | count }}'
          install_log_schedule_ended: >-
            {{
              not is_out_of_schedule_mode and
              input_schedule_entity is string and input_schedule_entity | length > 0 and
              not is_state(input_schedule_entity, "on")
            }}
      - alias: Log updates that were not installed
        if:
          - alias: Some updates found at the start were not installed
            condition: template
            value_template: '{{ install_log_not_installed | count > 0 }}'
        then:
          - alias: Set install log entry (not installed)
            variables:
              install_log_is_error: true
              install_log_message: |-
                {{ install_log_not_installed | count }} update{{ "s" if install_log_not_installed | count != 1 }} not installed
                {{- " (the schedule ended)" if install_log_schedule_ended else "" }}:
                {%- for e in install_log_not_installed %}
                  - {{ state_attr(e, "friendly_name") | default(e, true) }}:
                    {{- " " ~ state_attr(e, "installed_version") | default("?", true) }} -> {{ state_attr(e, "latest_version") | default("?", true) }}
                {%- endfor %}
          - *write_install_log
      - alias: Set install log entry (summary)
        variables:
          install_log_is_error: false
          install_log_message: >-
            Finished: {{ install_log_installed_count }} of {{ install_log_found_count }}
            update{{ "s" if install_log_found_count != 1 }} installed
      - *write_install_log

  - alias: Restart  # Restart Home Assistant
    sequence:
      - alias: Read the restart type input
        variables:
          input_restart_type: !input restart_type
      - alias: Restarting is enabled
        condition: template
        value_template: '{{ input_restart_type != "no-restart" }}'
      - alias: Wait pending operations  # Wait for any pending operations to complete
        continue_on_error: true
        wait_template: |
          {{
            (
              states.update
              | rejectattr('state', 'eq', 'off')
              | rejectattr('entity_id', 'in', input_update_exclusions)
              | map(attribute='entity_id')
              | list | count | int(0)
            ) < 1
          }}
        continue_on_timeout: true
        timeout:
          seconds: 30
      - &update_pending_restart_items
        alias: List items waiting for a restart
        variables:
          pending_restart_items: |
            {{ states.update
              | selectattr('attributes.release_summary', 'defined')
              | selectattr('attributes.release_summary', 'search', "<ha-alert alert-type='error'>")
              | map(attribute='name')
              | list
            }}
          pending_restart_items_count: '{{ pending_restart_items | count | int(0) }}'
      - alias: Log if nothing needs a restart
        if:
          - alias: Nothing is waiting for a restart
            condition: template
            value_template: '{{ pending_restart_items_count < 1 }}'
        then:
          - alias: Set log message (nothing requires a restart)
            variables:
              log_message: 'Nothing requiring a restart'
          - *logbook_update
      - &cond_restart_needed
        alias: Something is waiting for a restart
        condition: template
        value_template: '{{ pending_restart_items_count > 0 }}'
      - alias: Set log message (items pending a restart)
        variables:
          log_message: >
            {{ pending_restart_items_count }} item{{ "s" if pending_restart_items_count > 1 }} pending a restart:

            - {{ pending_restart_items | join("\n- ") }}
      - *logbook_update
      - &send_restart_notification
        alias: Send restart notification (if selected)
        if:
          - alias: Restart notifications are selected
            condition: template
            value_template: '{{ "restart" in input_notification_select_notifications }}'
        then:
          - *send_notification
      - alias: "Run custom restart actions"
        continue_on_error: true
        sequence: !input notification_action_restart

      - alias: "Restart"
        continue_on_error: true
        sequence:
          - *cond_restart_needed
          - alias: "Restart - Check config"
            continue_on_error: true
            action: homeassistant.check_config
          - alias: Read the config check result
            variables:
              has_invalid_config: >
                {{
                  states.persistent_notification.invalid_config.state
                  | default('unavailable') == 'notifying'
                }}
              has_check_config_notification: >
                {{
                  states.persistent_notification.homeassistant_check_config.state
                  | default('unavailable') == 'notifying'
                }}
          - alias: Restart only if the configuration is valid
            if:
              - alias: Configuration check reported a problem
                condition: template
                value_template: '{{ has_invalid_config or has_check_config_notification }}'
            then:
              - alias: Set log message (running pre-restart actions)
                variables:
                  log_message: 'Running pre-restart actions...'
              - *logbook_update
              - *send_restart_notification

              - alias: "Run pre-restart actions"
                continue_on_error: true
                sequence: !input actions_pre_restart
              - alias: Set log message (restart skipped)
                variables:
                  log_message: >
                    Skipping restart process due to notifications of invalid configurations:

                      - has_invalid_config = {{ has_invalid_config }}

                      - has_check_config_notification = {{ has_check_config_notification }}
              - *logbook_update
              - alias: Set install log entry (restart skipped)
                variables:
                  install_log_is_error: true
                  install_log_message: >-
                    Restart skipped because the configuration check reported a problem.
                    Waiting for a restart: {{ pending_restart_items | join(", ") }}
              - *write_install_log
              - *send_restart_notification
            else:
              - alias: Set log message (restarting)
                variables:
                  log_message: >
                    The system is set to restart automatically when an update requires it.

                    Restarting Home Assistant ({{ input_restart_type }})...
              - *logbook_update
              - alias: Set install log entry (restarting)
                variables:
                  install_log_is_error: false
                  install_log_message: >-
                    Restarting Home Assistant ({{ input_restart_type }}) for:
                    {{ pending_restart_items | join(", ") }}
              - *write_install_log
              - *send_restart_notification

              - alias: "Wait 15 seconds to deliver the notification message."
                delay:
                  seconds: 15

              - alias: "Restart - Call reboot service"
                continue_on_error: true
                action: '{{ "hassio.host_reboot" if input_restart_type == "host" else "homeassistant.restart" }}'

  - alias: Post-update actions
    sequence:
      - alias: Read the post-update actions input
        variables:
          input_actions_pos_update: !input actions_pos_update
      - alias: Post-update actions are configured
        condition: template
        value_template: '{{ input_actions_pos_update is sequence }}'
      - alias: Set log message (running post-update actions)
        variables:
          log_message: "Running post-update actions"
      - *logbook_update

      - alias: "Run post-update actions"
        continue_on_error: true
        sequence: !input actions_pos_update

  - alias: Set OFF helper flag
    if:
      - *cond_helper_flag_configured
    then:
      - alias: Turn off the update process toggle
        action: input_boolean.turn_off
        target:
          entity_id: !input update_process_started_entity
        continue_on_error: true

  - alias: Done  # All done!
    if:
      - *cond_updates_found
      - *cond_in_update_window
    then:
      - alias: Set log message (done)
        variables:
          log_message: "Done!"
      - *logbook_update
      - alias: Send done notification (if selected)
        if:
          - alias: Done notifications are selected
            condition: template
            value_template: '{{ "done" in input_notification_select_notifications }}'
        then:
          - *send_notification
      - alias: "Run custom done actions"
        continue_on_error: true
        sequence: !input notification_action_done
...
